server {
    listen 80;
    server_name localhost;

    root /var/www/client/dist;
    index index.html index.htm;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Block .git, .env, hidden files, and sensitive extensions
    location ~* /\.(git|svn|hg|bzr) {
        deny all;
        return 403;
    }

    location ~* /\.env {
        deny all;
        return 403;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        return 403;
    }

    location ~* \.(sql|bak|backup|dump|dmp|tar|gz|tgz|zip|log|key|pem|crt|db|sqlite|conf|ini|sh|py|java|class)$ {
        deny all;
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|ico|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }
}
