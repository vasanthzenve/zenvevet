apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenve-vet-worker
  namespace: zenve-vet
  labels:
    app: zenve-vet-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zenve-vet-worker
  template:
    metadata:
      labels:
        app: zenve-vet-worker
    spec:
      containers:
      - name: worker
        image: zenve-vet-backend:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: zenve-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: zenve-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: zenve-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: zenve-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: zenve-secrets
              key: db-password
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: zenve-config
              key: REDIS_HOST
        - name: SPRING_DATA_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: zenve-config
              key: REDIS_PORT
        resources:
          requests:
            cpu: "500m"
            memory: "1024Mi"
          limits:
            cpu: "1500m"
            memory: "2048Mi"

