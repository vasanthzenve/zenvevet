apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zenve-vet-backend-hpa
  namespace: zenve-vet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zenve-vet-backend
  minReplicas: 4
  maxReplicas: 25
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

