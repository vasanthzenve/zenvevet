apiVersion: v1
kind: ConfigMap
metadata:
  name: zenve-config
  namespace: zenve-vet
data:
  DB_HOST: "mysql-service.zenve-vet.svc.cluster.local"
  DB_PORT: "3306"
  DB_NAME: "zenvevet"
  DB_USER: "root"
  REDIS_HOST: "redis-service.zenve-vet.svc.cluster.local"
  REDIS_PORT: "6379"
  SPRING_CACHE_TYPE: "redis"
  TOMCAT_MAX_THREADS: "400"
  HIKARI_MAX_POOL_SIZE: "40"
  APP_URL: "https://zenvevet.com"
  SPRING_MAIL_HOST: "mail.zenvevet.com"
  SPRING_MAIL_PORT: "587"
---
apiVersion: v1
kind: Secret
metadata:
  name: zenve-secrets
  namespace: zenve-vet
type: Opaque
stringData:
  db-password: "REDACTED_DB_PWD"
  jwt-secret: "zenve_super_secure_32_byte_secret_key_production_2026"
  mail-password: "REDACTED_MAIL_PWD"

