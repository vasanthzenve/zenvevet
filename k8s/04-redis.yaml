apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: zenve-vet
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: zenve-vet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        command: ["redis-server", "--maxmemory", "1024mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1"]
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"

