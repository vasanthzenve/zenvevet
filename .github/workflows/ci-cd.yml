name: Zenve Vet Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # Stage 1: Build & Automated Testing
  # ============================================================================
  test:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Run Backend Compilation & Tests
      run: |
        cd server
        mvn clean test -B

    - name: Install Frontend Dependencies & Build
      run: |
        cd client
        npm ci
        npm run build

    - name: Run Production System Verification Suite
      run: |
        node scripts/test-production-system.js

  # ============================================================================
  # Stage 2: Container Security & Vulnerability Scan
  # ============================================================================
  security-scan:
    name: Container Security & SAST Scan
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Backend Docker Image for Scan
      run: |
        docker build -t zenve-vet-backend:${{ github.sha }} ./server

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'zenve-vet-backend:${{ github.sha }}'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

  # ============================================================================
  # Stage 3: Build & Push Production Images
  # ============================================================================
  build-and-push:
    name: Build & Push Images
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build & Push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./server
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/backend:latest
          ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build & Push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./client
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/frontend:latest
          ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 4: Kubernetes Rolling Deployment & Health Verification
  # ============================================================================
  deploy:
    name: Kubernetes Rolling Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure Kubeconfig
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG }}

    - name: Deploy Kubernetes Manifests
      run: |
        kubectl apply -f k8s/01-namespace.yaml
        kubectl apply -f k8s/02-configmaps-secrets.yaml
        kubectl apply -f k8s/03-mysql.yaml
        kubectl apply -f k8s/04-redis.yaml
        kubectl apply -f k8s/05-backend.yaml
        kubectl apply -f k8s/06-backend-hpa.yaml
        kubectl apply -f k8s/07-worker.yaml
        kubectl apply -f k8s/08-frontend.yaml
        kubectl apply -f k8s/09-ingress.yaml
        kubectl apply -f k8s/10-cronjobs.yaml
        kubectl apply -f k8s/11-network-policies.yaml

    - name: Verify Backend Rollout
      run: |
        kubectl rollout status deployment/zenve-vet-backend -n zenve-vet --timeout=120s

    - name: Verify Frontend Rollout
      run: |
        kubectl rollout status deployment/zenve-vet-frontend -n zenve-vet --timeout=60s

    - name: Post-Deployment Health Verification Probe
      run: |
        echo "Probing cluster health endpoint..."
        kubectl run health-probe --image=curlimages/curl:8.6.0 --rm -i --restart=Never -n zenve-vet -- \
          curl -f http://zenve-vet-backend-svc.zenve-vet.svc.cluster.local:8080/actuator/health || {
            echo "Health check failed! Initiating automated rollback..."
            kubectl rollout undo deployment/zenve-vet-backend -n zenve-vet
            kubectl rollout undo deployment/zenve-vet-frontend -n zenve-vet
            exit 1
          }
        echo "Cluster verified 100% HEALTHY!"

