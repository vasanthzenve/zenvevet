global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  # 1. Zenve Vet Enterprise API Gateway
  - job_name: "zenve-api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:8000"]

  # 2. Clustered Spring Boot Worker Instances (Actuator Prometheus)
  - job_name: "zenve-backend-cluster"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "localhost:8080"
          - "localhost:8081"
          - "localhost:8082"

  # 3. Redis Cache & Session Store
  - job_name: "zenve-redis"
    static_configs:
      - targets: ["localhost:6379"]

  # 4. MySQL Database Exporter
  - job_name: "zenve-mysql"
    static_configs:
      - targets: ["localhost:9104"]

